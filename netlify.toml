# The React (Vite) frontend and its API (frontend/netlify/functions) deploy from here.
# The root Python files are the legacy FastAPI backend and aren't used on Netlify.
[build]
  base = "frontend"
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serve index.html for client-side routes such as /query-engine
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
